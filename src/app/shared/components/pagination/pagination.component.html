<div
  class="px-4 py-3 border-t border-slate-200/80 bg-slate-50/50 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-slate-600"
>
  <div class="flex items-center gap-2">
    <span>Mostrar</span>
    <select
      [ngModel]="tamanioPagina()"
      (ngModelChange)="cambiarTamanio($event)"
      [attr.aria-label]="'Cantidad de ' + etiqueta() + ' por página'"
      class="h-8 px-2 rounded-lg border border-slate-300 text-xs bg-white text-slate-700 outline-none focus:ring-2 focus:ring-unsm-green/20 focus:border-unsm-green cursor-pointer transition-colors"
    >
      <option [ngValue]="10">10</option>
      <option [ngValue]="20">20</option>
      <option [ngValue]="50">50</option>
    </select>
    <span>{{ etiqueta() }} por página</span>
  </div>

  <div class="flex flex-wrap items-center justify-end gap-3 sm:gap-4">
    <span>
      Total:
      <strong class="text-slate-800 font-semibold">{{ totalElementos() }}</strong> registros
    </span>

    @if (totalPaginas() > 0) {
      <div class="inline-flex items-center gap-1">
        <button
          type="button"
          (click)="cambiarPagina(paginaActual() - 1)"
          [disabled]="paginaActual() === 0 || cargando()"
          class="h-8 w-8 flex items-center justify-center rounded-lg border border-slate-300 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors cursor-pointer"
          [class.hover:text-unsm-green]="colorActivo() === 'green'"
          [class.hover:text-unsm-cyan]="colorActivo() === 'cyan'"
          title="Página anterior"
          aria-label="Página anterior"
        >
          <svg lucideChevronLeft class="size-4"></svg>
        </button>

        @for (item of paginasNumeros(); track $index) {
          @if (item === '...') {
            <span
              class="h-8 min-w-8 px-1 flex items-center justify-center text-slate-400 font-medium select-none"
              aria-hidden="true"
            >
              ...
            </span>
          } @else {
            <button
              type="button"
              (click)="irAPagina(item)"
              [disabled]="cargando()"
              class="h-8 min-w-8 px-2.5 flex items-center justify-center rounded-lg text-xs font-semibold transition-all cursor-pointer"
              [class.bg-unsm-green]="colorActivo() === 'green' && item === paginaActual() + 1"
              [class.bg-unsm-cyan]="colorActivo() === 'cyan' && item === paginaActual() + 1"
              [class.text-white]="item === paginaActual() + 1"
              [class.shadow-xs]="item === paginaActual() + 1"
              [class.border]="item !== paginaActual() + 1"
              [class.border-slate-300]="item !== paginaActual() + 1"
              [class.bg-white]="item !== paginaActual() + 1"
              [class.text-slate-700]="item !== paginaActual() + 1"
              [class.hover:bg-slate-100]="item !== paginaActual() + 1"
              [class.hover:text-slate-900]="item !== paginaActual() + 1"
              [attr.aria-label]="'Página ' + item"
              [attr.aria-current]="item === paginaActual() + 1 ? 'page' : null"
            >
              {{ item }}
            </button>
          }
        }

        <button
          type="button"
          (click)="cambiarPagina(paginaActual() + 1)"
          [disabled]="paginaActual() >= totalPaginas() - 1 || cargando()"
          class="h-8 w-8 flex items-center justify-center rounded-lg border border-slate-300 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors cursor-pointer"
          [class.hover:text-unsm-green]="colorActivo() === 'green'"
          [class.hover:text-unsm-cyan]="colorActivo() === 'cyan'"
          title="Página siguiente"
          aria-label="Página siguiente"
        >
          <svg lucideChevronRight class="size-4"></svg>
        </button>
      </div>
    }
  </div>
</div>
