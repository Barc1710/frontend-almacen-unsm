<header
  class="sticky top-0 z-30 flex items-center justify-between h-16 px-4 md:px-6 bg-white border-b border-slate-200 select-none shadow-2xs"
  role="banner"
>
  <!-- Barra de acento institucional superior (invertida: amarillo -> celeste -> verde) -->
  <div
    class="absolute top-0 inset-x-0 h-0.5 bg-linear-to-r from-unsm-yellow/80 via-unsm-cyan to-unsm-green-dark pointer-events-none"
    aria-hidden="true"
  ></div>

  <!-- Barra de acento institucional inferior (sutil de 2px) -->
  <div
    class="absolute -bottom-px inset-x-0 h-0.5 bg-linear-to-r from-unsm-green-dark via-unsm-cyan to-unsm-yellow/80 pointer-events-none"
    aria-hidden="true"
  ></div>

  <!-- Sección Izquierda: Botón hamburguesa móvil + Título del Sistema con acento sutil -->
  <div class="flex items-center gap-3 md:gap-3.5 min-w-0">
    <!-- Botón Hamburguesa (solo visible en pantallas < 1024px) -->
    <button
      type="button"
      (click)="toggleMobileSidebar()"
      class="lg:hidden p-2 -ml-1 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors cursor-pointer focus-visible:ring-2 focus-visible:ring-unsm-cyan"
      aria-label="Alternar menú de navegación"
    >
      <svg lucideMenu class="size-6"></svg>
    </button>

    <!-- Barra de acento vertical institucional (verde a celeste) -->
    <div
      class="w-1 h-5 rounded-full bg-linear-to-b from-unsm-green to-unsm-cyan hidden sm:block shrink-0"
      aria-hidden="true"
    ></div>

    <!-- Título del Sistema -->
    <h1 class="text-base md:text-lg font-bold text-slate-800 tracking-tight truncate leading-none">
      Sistema de Almacén
    </h1>
  </div>

  <!-- Sección Derecha: Información de Usuario y Menú de Perfil -->
  <div class="flex items-center gap-3" id="profile-menu-container">
    <!-- Botón Desplegable de Perfil (sin fondo hover, solo cursor manito) -->
    <button
      type="button"
      (click)="toggleProfileMenu($event)"
      class="group flex items-center gap-2.5 p-1 md:px-2 rounded-lg outline-none cursor-pointer focus-visible:ring-2 focus-visible:ring-unsm-cyan focus-visible:ring-offset-2"
      [attr.aria-expanded]="isProfileMenuOpen()"
      aria-haspopup="true"
      aria-label="Menú de usuario"
    >
      <!-- Ícono de Perfil con indicador de estado en línea -->
      <div class="relative">
        <div
          class="size-8.5 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 border border-slate-200/90 shadow-2xs group-hover:border-unsm-cyan/60 transition-colors"
        >
          <svg
            lucideUser
            class="size-4.5 text-slate-600 group-hover:text-slate-800 transition-colors"
          ></svg>
        </div>
        <span
          class="absolute -bottom-0.5 -right-0.5 size-2.5 rounded-full bg-emerald-500 ring-2 ring-white"
          aria-hidden="true"
        ></span>
      </div>

      <!-- Solo Usuario (sin rol) -->
      <span
        class="hidden md:inline text-xs font-semibold text-slate-800 group-hover:text-slate-900 transition-colors truncate max-w-45"
      >
        {{ authService.userFullName() || authService.username() || 'Usuario' }}
      </span>

      <svg
        lucideChevronDown
        class="size-4 text-slate-400 group-hover:text-slate-600 transition-transform duration-200"
        [class.rotate-180]="isProfileMenuOpen()"
      ></svg>
    </button>

    <!-- Menú Desplegable Flotante de Perfil -->
    @if (isProfileMenuOpen()) {
      <div
        class="absolute right-4 md:right-6 top-16 mt-1 w-64 rounded-2xl bg-white border border-slate-200 shadow-xl shadow-slate-900/10 p-1.5 z-50"
        role="menu"
        aria-orientation="vertical"
      >
        <!-- Encabezado del Dropdown con superficie sutil -->
        <div
          class="p-3 rounded-xl bg-linear-to-br from-unsm-green-light/60 via-slate-50/70 to-white border border-slate-100 mb-1"
        >
          <div class="flex items-center gap-2.5">
            <div
              class="size-9 rounded-full bg-white border border-slate-200 flex items-center justify-center shrink-0 shadow-2xs text-unsm-green-dark"
            >
              <svg lucideUser class="size-4.5 text-unsm-green-dark"></svg>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-xs font-bold text-slate-900 truncate leading-snug">
                {{ authService.userFullName() || 'Usuario en Sesión' }}
              </p>
              <p class="text-xs text-slate-500 truncate leading-tight mt-0.5">
                &#64;{{ authService.username() }}
              </p>
            </div>
          </div>

          <!-- Rol alineado a la derecha sin punto celeste -->
          <div class="mt-2.5 pt-2 border-t border-slate-200/60 flex items-center justify-end">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider truncate">
              {{ authService.userProfile() || 'Usuario' }}
            </span>
          </div>
        </div>

        <!-- Acciones del Menú -->
        <div class="space-y-0.5">
          <!-- Entrada a Perfil (informativa) -->
          <button
            type="button"
            (click)="closeProfileMenu()"
            class="group w-full flex items-center gap-2.5 px-2.5 py-2 text-xs font-medium text-slate-700 hover:text-slate-900 hover:bg-linear-to-l hover:from-unsm-cyan/12 hover:via-unsm-cyan/5 hover:to-transparent rounded-lg transition-colors outline-none focus-visible:ring-2 focus-visible:ring-unsm-cyan cursor-pointer text-left"
            role="menuitem"
          >
            <div
              class="size-7 rounded-md bg-unsm-cyan text-white flex items-center justify-center shrink-0 shadow-2xs"
            >
              <svg lucideUser class="size-3.5 text-white stroke-2"></svg>
            </div>
            <span class="font-medium text-slate-700 group-hover:text-slate-900 transition-colors">
              Perfil
            </span>
          </button>

          <!-- Divisor fino -->
          <div class="h-px bg-slate-100 my-1 mx-2" aria-hidden="true"></div>

          <!-- Cerrar Sesión -->
          <button
            type="button"
            (click)="logout()"
            class="group w-full flex items-center gap-2.5 px-2.5 py-2 text-xs font-semibold text-unsm-red hover:bg-linear-to-l hover:from-unsm-red/12 hover:via-unsm-red/5 hover:to-transparent rounded-lg transition-colors outline-none focus-visible:ring-2 focus-visible:ring-unsm-red cursor-pointer text-left"
            role="menuitem"
          >
            <div
              class="size-7 rounded-md bg-unsm-red text-white flex items-center justify-center shrink-0 shadow-2xs"
            >
              <svg lucideLogOut class="size-3.5 text-white stroke-2"></svg>
            </div>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    }
  </div>
</header>
