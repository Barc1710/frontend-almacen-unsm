<div class="flex flex-col h-full bg-[#007A30] text-white select-none">
  <!-- Cabecera Institucional del Sidebar -->
  <div class="px-3.5 pt-5 pb-2 flex items-start justify-between shrink-0">
    <div class="flex items-start gap-3 min-w-0 flex-1">
      <!-- Escudo Institucional centrado verticalmente únicamente con UNIDAD DE SERVICIOS GENERALES -->
      <div class="flex items-center shrink-0 min-h-[64px]">
        <img
          ngSrc="/images/logos/escudo_unsm.png"
          width="60"
          height="68"
          priority
          alt="Escudo Oficial UNSM"
          class="h-16 sm:h-[66px] w-auto object-contain select-none drop-shadow-md"
        />
      </div>

      <div class="flex flex-col min-w-0 font-sans flex-1">
        <!-- Bloque de 3 líneas centrado con el escudo, letra más grande -->
        <div class="flex items-center min-h-[64px]">
          <h2 class="text-[1.02rem] sm:text-[1.10rem] font-bold text-white tracking-tight uppercase leading-[1.12]">
            UNIDAD DE<br />SERVICIOS<br />GENERALES
          </h2>
        </div>
        <!-- UNSM más pequeño en amarillo institucional, fuera del centrado del logo -->
        <span class="text-[10px] font-bold text-[#FFE800] tracking-widest uppercase mt-0.5">
          UNSM
        </span>
      </div>
    </div>

    <!-- Botón de cierre para drawer móvil -->
    <button
      type="button"
      (click)="closeMobileMenu()"
      class="lg:hidden p-1.5 rounded-lg text-white/70 hover:text-white hover:bg-white/10 transition-colors cursor-pointer focus-visible:ring-2 focus-visible:ring-[#00A0DF] shrink-0 ml-1 mt-1"
      aria-label="Cerrar menú lateral"
    >
      <svg lucideX class="size-5"></svg>
    </button>
  </div>

  <!-- Lista de Navegación Principal -->
  <nav
    class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5"
    role="navigation"
    aria-label="Menú principal de navegación"
  >
    <!-- Separador distintivo de cabecera antes de Dashboard -->
    <div class="h-px bg-white/20 mx-3 my-2 shadow-2xs" aria-hidden="true"></div>

    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: true }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideLayoutDashboard class="size-4.5"></svg>
      </div>
      <span class="truncate">Dashboard</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Inventario -->
    <a
      routerLink="/articulos"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideBoxes class="size-4.5"></svg>
      </div>
      <span class="truncate">Inventario</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Ingresos -->
    <a
      routerLink="/ingresos"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideTruck class="size-4.5"></svg>
      </div>
      <span class="truncate">Ingresos</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Egresos -->
    <a
      routerLink="/egresos"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucidePackageCheck class="size-4.5"></svg>
      </div>
      <span class="truncate">Egresos</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Kardex -->
    <a
      routerLink="/kardex/general"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideClipboardList class="size-4.5"></svg>
      </div>
      <span class="truncate">Kardex</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Proveedores -->
    <a
      routerLink="/mantenimiento/proveedores"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideBuilding2 class="size-4.5"></svg>
      </div>
      <span class="truncate">Proveedores</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Clientes -->
    <a
      routerLink="/mantenimiento/clientes"
      (click)="closeMobileMenu()"
      routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.icon-box]:bg-[#00A0DF] [&_.icon-box]:text-white [&_.icon-box]:shadow-sm"
      [routerLinkActiveOptions]="{ exact: false }"
      class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
    >
      <div class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
        <svg lucideUsers class="size-4.5"></svg>
      </div>
      <span class="truncate">Clientes</span>
    </a>

    <!-- Separador sutil -->
    <div class="h-px bg-gradient-to-r from-transparent via-white/12 to-transparent my-1 mx-3" aria-hidden="true"></div>

    <!-- Seguridad (Desplegable) -->
    <div class="space-y-1">
      <button
        type="button"
        (click)="toggleSeguridad()"
        [class.bg-white\/15]="isSeguridadOpen() || isSeguridadActive()"
        [class.text-white]="isSeguridadOpen() || isSeguridadActive()"
        [class.font-bold]="isSeguridadOpen() || isSeguridadActive()"
        [class.ring-1]="isSeguridadOpen() || isSeguridadActive()"
        [class.ring-white\/20]="isSeguridadOpen() || isSeguridadActive()"
        [class.shadow-xs]="isSeguridadOpen() || isSeguridadActive()"
        class="w-full group flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
        [attr.aria-expanded]="isSeguridadOpen()"
        aria-controls="submenu-seguridad"
      >
        <div class="flex items-center gap-3 min-w-0">
          <div
            [class.bg-\[\#00A0DF\]]="isSeguridadOpen() || isSeguridadActive()"
            [class.text-white]="isSeguridadOpen() || isSeguridadActive()"
            [class.shadow-sm]="isSeguridadOpen() || isSeguridadActive()"
            class="icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150"
          >
            <svg lucideShieldCheck class="size-4.5"></svg>
          </div>
          <span class="truncate">Seguridad</span>
        </div>
        <svg
          lucideChevronDown
          class="size-4 text-white/70 transition-transform duration-200 shrink-0 ml-2"
          [class.rotate-180]="isSeguridadOpen()"
        ></svg>
      </button>

      <!-- Submódulo: Usuarios (mismo tamaño que los módulos, ancho reducido por la indentación ml-5) -->
      @if (isSeguridadOpen()) {
        <div id="submenu-seguridad" class="mt-1 space-y-1 ml-5 animate-in fade-in slide-in-from-top-1 duration-150">
          <a
            routerLink="/seguridad/usuarios"
            (click)="closeMobileMenu()"
            routerLinkActive="bg-white/15 text-white font-bold shadow-xs ring-1 ring-white/20 [&_.sub-icon-box]:bg-[#FFE800] [&_.sub-icon-box]:text-[#004e1a] [&_.sub-icon-box]:shadow-sm"
            [routerLinkActiveOptions]="{ exact: false }"
            class="group flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors duration-150 outline-none cursor-pointer select-none focus-visible:ring-2 focus-visible:ring-[#00A0DF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#007A30]"
          >
            <div class="sub-icon-box size-8 rounded-lg bg-white/10 flex items-center justify-center shrink-0 text-white/80 group-hover:bg-white/20 group-hover:text-white transition-colors duration-150">
              <svg lucideUserCog class="size-4.5"></svg>
            </div>
            <span class="truncate">Usuarios</span>
          </a>
        </div>
      }
    </div>
  </nav>
</div>
