@if (visible()) {
  <dialog
    appModalDialog
    (cancel)="onCerrar()"
    class="m-0 border-0 max-w-none max-h-none w-screen h-dvh fixed inset-0 z-50 p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'modal-perfil-title'"
  >
    <div
      class="min-h-full flex items-center justify-center py-4 sm:py-6"
      (click)="onBackdropClick($event)"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md my-auto overflow-hidden flex flex-col"
        (click)="$event.stopPropagation()"
      >
        <!-- Cabecera del Modal (Sin ícono, estilo artículo) -->
        <div
          class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70 shrink-0"
        >
          <h3 id="modal-perfil-title" class="text-lg font-bold text-slate-800">
            {{ isEdit() ? 'Editar Perfil' : 'Nuevo Perfil' }}
          </h3>
          <button
            type="button"
            (click)="onCerrar()"
            [disabled]="guardando()"
            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition-colors cursor-pointer disabled:opacity-50"
            aria-label="Cerrar modal"
          >
            <svg lucideX class="size-5"></svg>
          </button>
        </div>

        <!-- Cuerpo del Modal -->
        <div class="p-6">
          @if (errorGeneral()) {
            <div
              class="mb-4 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-900 flex items-start gap-3"
              role="alert"
            >
              <svg lucideCircleAlert class="size-5 text-unsm-red shrink-0 mt-0.5"></svg>
              <div class="flex-1">
                <p class="text-sm font-semibold text-red-800">Error</p>
                <p class="text-xs text-red-700 mt-0.5">{{ errorGeneral() }}</p>
              </div>
            </div>
          }

          <form [formGroup]="form" (ngSubmit)="onSubmit()" id="perfilForm" novalidate>
            <div>
              <label
                for="nombrePerfil"
                class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5"
              >
                Nombre del Perfil <span class="text-unsm-red">*</span>
              </label>
              <input
                id="nombrePerfil"
                type="text"
                maxlength="100"
                formControlName="nombre"
                class="w-full h-10 px-3 text-sm uppercase rounded-lg border text-slate-800 transition-colors outline-none focus:ring-2 focus:ring-unsm-green/20 focus:border-unsm-green"
                [class.border-unsm-red]="isFieldInvalid()"
                [class.border-slate-300]="!isFieldInvalid()"
              />
              @if (isFieldInvalid()) {
                <p class="text-xs text-unsm-red mt-1">El nombre del perfil es obligatorio</p>
              }
            </div>
          </form>
        </div>

        <!-- Pie del Modal -->
        <div
          class="px-6 py-4 border-t border-slate-100 flex items-center justify-end gap-3 bg-slate-50/70 shrink-0"
        >
          <button
            type="button"
            (click)="onCerrar()"
            [disabled]="guardando()"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 transition-colors cursor-pointer disabled:opacity-50"
          >
            Cancelar
          </button>
          <button
            type="submit"
            form="perfilForm"
            [disabled]="guardando() || form.invalid"
            class="flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold text-white bg-unsm-green hover:bg-unsm-green-dark active:scale-[0.98] shadow-sm transition-all duration-150 cursor-pointer disabled:opacity-60 disabled:pointer-events-none"
          >
            @if (guardando()) {
              <svg lucideLoader2 class="size-4 animate-spin"></svg>
              <span>Guardando...</span>
            } @else {
              <svg lucideSave class="size-4"></svg>
              <span>{{ isEdit() ? 'Actualizar' : 'Guardar' }}</span>
            }
          </button>
        </div>
      </div>
    </div>
  </dialog>
}
